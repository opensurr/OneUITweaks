name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Copy APK with a clear name
        run: cp app/build/outputs/apk/debug/app-debug.apk OneUITweak.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OneUITweak-apk
          path: OneUITweak.apk

      - name: Publish downloadable APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: OneUI Tweak build ${{ github.run_number }}
          files: OneUITweak.apk
